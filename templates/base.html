{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowTime</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0d0d0d;
            color:#fff;
            min-height:100vh;
        }

        a{
            color:inherit;
        }

        /* NAVBAR */
        .navbar{
            position:sticky;
            top:0;
            z-index:1000;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            padding:14px 24px;
            background:#060606;
            border-bottom:1px solid rgba(255,255,255,0.06);
        }

        .brand{
            font-size:28px;
            font-weight:800;
            text-decoration:none;
            color:#ff4d4d;
            letter-spacing:-0.5px;
            white-space:nowrap;
        }

        .nav-links{
            display:flex;
            align-items:center;
            gap:22px;
            flex-wrap:wrap;
        }

        .nav-links a{
            text-decoration:none;
            color:#f2f2f2;
            font-size:15px;
            font-weight:600;
            opacity:.92;
        }

        .nav-links a:hover{
            color:#ff4d4d;
        }

        .nav-right{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .search-box{
            width:200px;
            max-width:28vw;
            padding:10px 14px;
            border:none;
            outline:none;
            border-radius:999px;
            background:#1a1a1a;
            color:#fff;
            border:1px solid rgba(255,255,255,0.06);
        }

        .icon-btn{
            width:44px;
            height:44px;
            border:none;
            border-radius:50%;
            background:#ff4d4d;
            color:#fff;
            cursor:pointer;
            font-size:18px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .auth-btn{
            text-decoration:none;
            padding:10px 16px;
            border-radius:12px;
            background:#1a1a1a;
            border:1px solid rgba(255,255,255,0.06);
            color:#fff;
            font-weight:700;
            font-size:14px;
        }

        .auth-btn:hover{
            background:#262626;
        }

        .username-pill{
            padding:10px 14px;
            border-radius:999px;
            background:#1a1a1a;
            border:1px solid rgba(255,255,255,0.06);
            font-size:14px;
            font-weight:700;
            white-space:nowrap;
        }

        .main-content{
            width:100%;
            min-height:calc(100vh - 72px);
        }

        /* CHAT WIDGET */
        .chat-fab{
            position:fixed;
            right:18px;
            bottom:18px;
            z-index:2000;
            width:58px;
            height:58px;
            border:none;
            border-radius:50%;
            background:#ff4d4d;
            color:#fff;
            font-size:22px;
            cursor:pointer;
            box-shadow:0 12px 30px rgba(0,0,0,.35);
        }

        .chat-box{
            position:fixed;
            right:18px;
            bottom:86px;
            width:320px;
            height:420px;
            background:#151515;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:16px;
            box-shadow:0 16px 40px rgba(0,0,0,.45);
            z-index:2000;
            display:none;
            overflow:hidden;
        }

        .chat-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:14px 16px;
            background:#121212;
            border-bottom:1px solid rgba(255,255,255,0.06);
            font-weight:800;
        }

        .chat-close{
            background:transparent;
            border:none;
            color:#fff;
            font-size:24px;
            cursor:pointer;
            line-height:1;
        }

        .chat-messages{
            height:calc(100% - 118px);
            overflow-y:auto;
            padding:14px;
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .chat-bot,
        .chat-user{
            max-width:85%;
            padding:10px 12px;
            border-radius:14px;
            font-size:14px;
            line-height:1.5;
            word-wrap:break-word;
        }

        .chat-bot{
            align-self:flex-start;
            background:#242424;
            color:#fff;
        }

        .chat-user{
            align-self:flex-end;
            background:#ff4d4d;
            color:#fff;
        }

        .chat-input-row{
            display:flex;
            gap:10px;
            padding:12px;
            border-top:1px solid rgba(255,255,255,0.06);
            background:#121212;
        }

        .chat-input{
            flex:1;
            padding:12px 14px;
            border-radius:12px;
            border:none;
            outline:none;
            background:#1d1d1d;
            color:#fff;
        }

        .chat-send{
            width:48px;
            border:none;
            border-radius:12px;
            background:#ff4d4d;
            color:#fff;
            font-size:18px;
            cursor:pointer;
        }

        @media (max-width: 900px){
            .navbar{
                flex-wrap:wrap;
                gap:12px;
            }

            .nav-links{
                gap:14px;
            }

            .search-box{
                width:160px;
                max-width:45vw;
            }
        }

        @media (max-width: 640px){
            .nav-links{
                display:none;
            }

            .search-box{
                width:150px;
                max-width:55vw;
            }

            .chat-box{
                width:92vw;
                right:4vw;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="{% url 'home' %}" class="brand">ShowTime</a>

        <nav class="nav-links">
            <a href="{% url 'home' %}">🏠 Home</a>
            <a href="{% url 'movies' %}">🎬 Movies</a>
            <a href="{% url 'explore' %}">🧭 Explore</a>
            <a href="{% url 'events' %}">🎭 Events</a>
            <a href="{% url 'wishlist' %}">💗 Wishlist</a>
            <a href="{% url 'food_offers' %}">🍔 Food & Combos</a>
            <a href="{% url 'my_bookings' %}">🎟 My Bookings</a>
        </nav>

        <div class="nav-right">
    <input class="search-box" type="text" placeholder="Search movies...">

    <button id="chat-toggle" class="icon-btn" type="button" aria-label="Open chatbot">
        🤖
    </button>

    {% if user.is_authenticated %}
        <span class="username-pill">👋 {{ user.username }}</span>
        <a href="{% url 'logout' %}" class="auth-btn">Logout</a>
    {% else %}
        <a href="{% url 'signup' %}" class="auth-btn">Signup</a>
        <a href="{% url 'login' %}" class="auth-btn">Login</a>
    {% endif %}
</div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- CHATBOT -->
    <button id="chat-toggle-fab" class="chat-fab" type="button" aria-label="Toggle chatbot">
        🤖
    </button>

    <div id="chat-box" class="chat-box">
        <div class="chat-header">
            <span>ShowTime AI</span>
            <button id="chat-close" class="chat-close" type="button" aria-label="Close chatbot">×</button>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="chat-bot">👋 Hi! Ask me movie recommendations.</div>
        </div>

        <div class="chat-input-row">
            <input
                id="chat-input"
                class="chat-input"
                type="text"
                placeholder="Type horror, comedy, action..."
                autocomplete="off"
            >
            <button id="chat-mic" class="chat-send" type="button" title="Voice input" aria-label="Voice input">🎤</button>
            <button id="chat-send" class="chat-send" type="button" title="Send" aria-label="Send message">➤</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const chatToggle = document.getElementById("chat-toggle");
            const chatToggleFab = document.getElementById("chat-toggle-fab");
            const chatBox = document.getElementById("chat-box");
            const chatClose = document.getElementById("chat-close");
            const chatMessages = document.getElementById("chat-messages");
            const chatInput = document.getElementById("chat-input");
            const chatMic = document.getElementById("chat-mic");
            const chatSend = document.getElementById("chat-send");

            if (!chatToggle || !chatToggleFab || !chatBox || !chatClose || !chatMessages || !chatInput || !chatMic || !chatSend) {
                return;
            }

            function getCSRFToken() {
                const match = document.cookie
                    .split("; ")
                    .find(row => row.startsWith("csrftoken="));
                return match ? match.split("=")[1] : "";
            }

            function addMessage(text, sender) {
                const msg = document.createElement("div");
                msg.className = sender === "user" ? "chat-user" : "chat-bot";
                msg.textContent = text;
                chatMessages.appendChild(msg);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            async function sendMessage() {
                const message = chatInput.value.trim();
                if (!message) return;

                addMessage(message, "user");
                chatInput.value = "";

                try {
                    const response = await fetch("/chatbot-reply/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": getCSRFToken()
                        },
                        body: JSON.stringify({ message: message })
                    });

                    const data = await response.json();

                    if (data.reply) {
                        addMessage(data.reply, "bot");
                    } else {
                        addMessage("Sorry, I could not understand that.", "bot");
                    }
                } catch (error) {
                    console.error("Chatbot error:", error);
                    addMessage("Something went wrong. Please try again.", "bot");
                }
            }

            function openChat() {
                chatBox.style.display = "block";
            }

            function closeChat() {
                chatBox.style.display = "none";
            }

            chatToggle.addEventListener("click", openChat);
            chatToggleFab.addEventListener("click", openChat);
            chatClose.addEventListener("click", closeChat);

            chatSend.addEventListener("click", sendMessage);

            chatInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Voice input
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                chatMic.style.display = "none";
            } else {
                const recognition = new SpeechRecognition();
                recognition.lang = "en-US";
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                chatMic.addEventListener("click", function () {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error("Speech recognition start error:", e);
                    }
                });

                recognition.onresult = function (event) {
                    const transcript = event.results[0][0].transcript;
                    chatInput.value = transcript;
                    chatInput.focus();
                };

                recognition.onerror = function (event) {
                    console.error("Speech Recognition Error:", event.error);
                };
            }
        });
    </script>

</body>
</html>
